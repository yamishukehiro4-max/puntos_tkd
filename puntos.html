<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcador de Taekwondo ITF</title>
  <link rel="stylesheet" href="puntos.css?v=2.1">
</head>
<body>
  <!-- BOTÓN PARA TRANSMITIR A PANTALLA (Alineado a la derecha) -->
  <div class="top-bar">
    <div class="sync-panel">
      <div class="sync-info">
        <span id="sync-status" class="sync-status offline">⚪ Desconectado</span>
        <span class="room-label">Sala: <strong id="current-room-label">FINAL-01</strong></span>
      </div>

      <div class="room-controls">
        <input
          id="room-input"
          type="text"
          value="FINAL-01"
          maxlength="24"
          placeholder="Código de sala"
          autocomplete="off"
        >
        <button class="btn-room" onclick="connectRoom()">Conectar</button>
        <button class="btn-room secondary" onclick="copyShareLink()">🔗 Copiar enlace</button>
      </div>
    </div>
    <button class="btn-transmit" onclick="openDisplayWindow()">📺 Transmitir Pantalla</button>
  </div>

  <!-- PANTALLA DE CARGA -->
  <div id="loader-wrapper">
    <div class="loader-content">
      <img src="logo.png" alt="Cargando" class="loader-logo">
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div id="main-content" style="display: none;">
    <div class="score-board">
      <!-- LADO AZUL -->
      <div class="side blue-side">
        <input type="text" class="school-name" id="school-blue" value="" placeholder="Escuela / Club Azul" oninput="queueFieldSync('schoolBlue', this.value); updateDisplayWindow()">
        <input type="text" class="fighter-name" id="name-blue" value="Competidor Azul" placeholder="Nombre Azul" oninput="queueFieldSync('nameBlue', this.value); updateDisplayWindow()">
        <div class="score-display" id="score-blue">0</div>
        
        <div class="controls">
          <button class="btn" onclick="addPoints('blue', 1)">+1 Punto</button>
          <button class="btn" onclick="addPoints('blue', 2)">+2 Puntos</button>
          <button class="btn" onclick="addPoints('blue', 3)">+3 Puntos</button>
          <button class="btn penalty" onclick="addPoints('blue', -1)">-1 Punto</button>
          <button class="btn warning" onclick="addGamjeom('blue')">Amonestación</button>
        </div>

        <div class="history-title">Historial Local:</div>
        <ul class="history-list" id="history-blue"></ul>
      </div>

      <!-- LADO ROJO -->
      <div class="side red-side">
        <input type="text" class="school-name" id="school-red" value="" placeholder="Escuela / Club Rojo" oninput="queueFieldSync('schoolRed', this.value); updateDisplayWindow()">
        <input type="text" class="fighter-name" id="name-red" value="Competidor Rojo" placeholder="Nombre Rojo" oninput="queueFieldSync('nameRed', this.value); updateDisplayWindow()">
        <div class="score-display" id="score-red">0</div>
        
        <div class="controls">
          <button class="btn" onclick="addPoints('red', 1)">+1 Punto</button>
          <button class="btn" onclick="addPoints('red', 2)">+2 Puntos</button>
          <button class="btn" onclick="addPoints('red', 3)">+3 Puntos</button>
          <button class="btn penalty" onclick="addPoints('red', -1)">-1 Punto</button>
          <button class="btn warning" onclick="addGamjeom('red')">Amonestación</button>
        </div>

        <div class="history-title">Historial Local:</div>
        <ul class="history-list" id="history-red"></ul>
      </div>
    </div>

    <!-- CRONÓMETRO Y CONTROLES GLOBALES -->
    <div class="bottom-controls">
      <div class="timer-container">
        <div class="timer-adjust">
          <button class="btn-adjust" onclick="adjustTimer(60)">+1 Min</button>
          <button class="btn-adjust" onclick="adjustTimer(10)">+10 Seg</button>
          <button class="btn-adjust" onclick="adjustTimer(-10)">-10 Seg</button>
          <button class="btn-adjust" onclick="adjustTimer(-60)">-1 Min</button>
        </div>
        
        <div class="timer-display" id="timer">02:00</div>
        
        <div class="timer-buttons">
          <button class="btn-timer start" onclick="startTimer()">Iniciar</button>
          <button class="btn-timer pause" onclick="pauseTimer()">Pausar</button>
          <button class="btn-timer reset" onclick="resetTimer()">Reset Tiempo</button>
        </div>
      </div>
      
      <div class="global-actions">
        <button class="reset-btn" onclick="resetBoard()">Reiniciar Pelea</button>
        <button class="history-btn" onclick="openGlobalHistory()">Ver Historial General</button>
      </div>
    </div>
  </div>

  <!-- MODAL HISTORIAL GLOBAL -->
  <div id="history-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeGlobalHistory()">&times;</span>
      <h2>Historial General del Torneo</h2>
      <div class="modal-columns">
        <div class="modal-col blue-col">
          <h3 id="modal-blue-name">Equipo Azul</h3>
          <ul class="global-history-list" id="global-history-blue"></ul>
        </div>
        <div class="modal-col red-col">
          <h3 id="modal-red-name">Equipo Rojo</h3>
          <ul class="global-history-list" id="global-history-red"></ul>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="firebase.js?v=2.1"></script>
  <script type="module" src="puntos.js?v=2.1"></script>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader-wrapper');
        const main = document.getElementById('main-content');
        if(loader) loader.style.display = 'none';
        if(main) main.style.display = 'flex';
      }, 2500);
    });
  </script>
</body>
</html>
